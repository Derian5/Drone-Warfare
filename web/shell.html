<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12171e">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#12171e; color:#e7e9ed; font:15px system-ui,sans-serif; }
    body { user-select:none; -webkit-user-select:none; }
    #canvas { display:block; width:100%; height:100%; outline:none; }
    #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; background:#12171e; }
    h1 { font-size:28px; letter-spacing:4px; font-weight:800; margin:0; }
    progress { width:300px; height:6px; accent-color:#1fbecb; }
    #message { max-width:600px; padding:0 24px; text-align:center; color:#9aabb4; white-space:pre-line; }
    #error-log { color:#f2bd76; white-space:pre-wrap; max-width:80vw; font-size:12px; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body data-game-ready="false" data-scene="loading">
  <canvas id="canvas" tabindex="0">This game requires a browser with WebGL 2.</canvas>
  <div id="loading">
    <h1>DRONE WARFARE</h1>
    <progress id="progress" max="1" value="0"></progress>
    <div id="message">Deploying the battlefield and drone factory…</div>
    <pre id="error-log"></pre>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const message = document.getElementById('message');
    const log = document.getElementById('error-log');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    function fail(error) {
      document.body.dataset.bootError = String(error);
      loading.style.display = 'flex';
      message.textContent = 'Could not start the game. WebGL 2 and an HTTP server are required.\nIf you opened the file directly, run play_web.bat.';
      log.textContent = String(error);
    }
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame({
      canvas: document.getElementById('canvas'),
      onProgress(current, total) {
        if (total > 0) progress.value = current / total;
      },
      onPrintError(...args) {
        const text = args.join(' ');
        console.error(text);
        if (/SCRIPT ERROR|SHADER ERROR|Parse Error/.test(text)) {
          document.body.dataset.runtimeError = text;
          log.textContent += text + '\n';
        }
      }
    }).then(() => {
      document.body.dataset.engineStarted = 'true';
      loading.style.display = 'none';
      document.getElementById('canvas').focus();
    }).catch(fail);
  </script>
</body>
</html>
